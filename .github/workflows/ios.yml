# The r86 iOS app for the simulator on Apple silicon: a compile check, and an
# app to install with `xcrun simctl install booted r86.app`. It embeds the
# Watch app (r86.app/Watch/r86.app); rust-src lets apple/build-rust.sh build
# std for the tier 3 watchOS targets. With "device", also the iPhone/iPad
# app with its Watch app as an unsigned IPA, to sign with your own identity
# and profiles (script/build_ios.sh device documents signed builds).
# Artifacts carry the version, v2026.11.18-b0dd54 (script/current-tree-version.sh).
name: iOS app

on:
  workflow_dispatch:
    inputs:
      device:
        description: Also build the unsigned device app (iPhone, iPad, Apple Watch)
        type: boolean
        default: false

jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # The newest Xcode on the runner: the iPhone Duo APIs need the iOS 27.1
      # SDK; older SDKs build without the laptop posture.
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "iOS simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"

      # The DOS kit release that assets/freedos-kit.sha256 pins.
      - name: DOS kit
        run: |
          read -r sha256 name < assets/freedos-kit.sha256
          mkdir -p tmp/freedos/share
          curl -sfL -o tmp/freedos/share/dos.zip \
            "https://github.com/${{ github.repository }}/releases/download/freedos-kit-${sha256:0:8}/$name"
          echo "$sha256  tmp/freedos/share/dos.zip" | shasum -a 256 -c -

      # The tools disc release that assets/tools-disc.sha256 pins.
      - name: Tools disc
        run: |
          read -r sha256 name < assets/tools-disc.sha256
          curl -sfL -o "assets/$name" \
            "https://github.com/${{ github.repository }}/releases/download/tools-disc-${sha256:0:8}/$name"
          echo "$sha256  assets/$name" | shasum -a 256 -c -

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rust-src --target aarch64-apple-ios-sim
          rustc -V

      - name: Version
        run: echo "R86_VERSION=$(script/current-tree-version.sh)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          script/build_ios.sh simulator
          cd apple/build/ios-simulator && zip -qry "r86-ios-simulator-$R86_VERSION.zip" r86.app

      - uses: actions/upload-artifact@v4
        with:
          name: r86-ios-simulator-${{ env.R86_VERSION }}
          path: apple/build/ios-simulator/r86-ios-simulator-${{ env.R86_VERSION }}.zip

      - name: Build for devices (unsigned)
        if: inputs.device
        run: |
          rustup target add aarch64-apple-ios
          script/build_ios.sh device
          cd apple/build/ios-device
          rm -rf Payload && mkdir Payload && cp -R r86.app Payload/
          zip -qry "r86-ios-$R86_VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: inputs.device
        with:
          name: r86-ios-${{ env.R86_VERSION }}-unsigned
          path: apple/build/ios-device/r86-ios-${{ env.R86_VERSION }}-unsigned.ipa
          if-no-files-found: error
