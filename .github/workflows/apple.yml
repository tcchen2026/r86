# The r86 Mac app (Apple silicon, macOS 26): ad-hoc signed and sandboxed,
# uploaded as a dmg artifact. Notarization needs Developer ID secrets (later).
name: Mac app

on:
  workflow_dispatch:

jobs:
  jit:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Native arm64 tools
        id: tools
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          brew install nasm
          echo "::notice title=Mac host::arch=$(uname -m); macOS=$(sw_vers -productVersion); model=$(sysctl -n hw.model); rust=$(rustc -V); hosted runner, core placement unobserved"
      # Ordinary cargo executables are not Hardened Runtime apps. MAP_JIT must
      # work here without app entitlements; the signed app has its own build job.
      - name: Native JIT and ABI tests
        run: |
          python3 script/apple_jit_check.py tests
      - name: Build CLI, ReactOS observer and region probe
        id: binaries
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          cargo build --locked --release --no-default-features --features apple,jit \
            --bin r86-run --example reactos_boot_benchmark --example apple_jit_regions
      - name: Deterministic boot, JIT against --no-jit
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          # Hosted runners are virtual machines; their PMU counters may read zero.
          # The gate prints them; --require-host-counters is for real Macs.
          python3 script/apple_jit_check.py rom target/release/r86-run
      # Hosted macOS runners have SIP off: these signing/region observations
      # cannot establish Hardened Runtime enforcement on a regular Mac.
      - name: Observe signed JIT with and without allow-jit (SIP off)
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          python3 script/apple_jit_check.py hardened target/release/r86-run
      - name: Observe sequential and concurrent MAP_JIT regions (SIP off)
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          python3 script/apple_jit_check.py regions target/release/examples/apple_jit_regions
      - name: Pinned ReactOS LiveCD
        id: reactos
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          python3 script/apple_jit_check.py download-reactos
      - name: ReactOS language dialog and protection rate
        if: ${{ !cancelled() && steps.reactos.outcome == 'success' }}
        run: |
          python3 script/apple_jit_check.py reactos \
            target/release/examples/reactos_boot_benchmark \
            tmp/apple-jit-ci/ReactOS.iso
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-jit-evidence
          path: |
            tmp/apple-jit-ci/*.log
            tmp/apple-jit-ci/*.json
            tmp/apple-jit-ci/*.ppm
            tmp/apple-jit-ci/*.plist

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          swiftc --version
          rustc -V

      - name: Build
        run: |
          script/build_macos.sh
          codesign -d --entitlements - apple/build/r86.app

      - uses: actions/upload-artifact@v4
        with:
          name: r86-mac
          path: apple/build/r86.dmg
