[package]
name = "r86"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
default-run = "r86-run"
autobins = false

[features]
default = ["host", "jit"]
host = ["machine", "bus-instruction-context", "dep:flate2", "dep:toml", "dep:libc", "dep:fatfs", "dep:chrono", "dep:windows"]
machine = ["dep:font8x8"]
web-frontend = ["machine"]
wasm-jit = ["web-frontend", "jit"]
# Attribute unclaimed bus accesses to the current x86 instruction. Firmware can
# opt in; otherwise no diagnostic address is written on every instruction.
bus-instruction-context = ["machine"]
sdl2-frontend = ["host", "dep:sdl2"]
# Linux handheld frontend: framebuffer/evdev (M5Stack CardputerZero), or the
# system's libSDL2 loaded at run time (TrimUI and other SDL2 firmwares).
handheld-frontend = ["host", "toml/display"]
# The same app in a desktop window with ./tmp/handheld data, for trying it
# without the device.
handheld-sdl = ["handheld-frontend"]
# The C API linked into the Mac app (apple/), built as a staticlib.
apple = ["host", "toml/display"]
# The Windows app (win32/, amd64 and arm64): VM library and VM windows on
# Win32 and GDI, built with MinGW.
win32-frontend = ["host", "toml/display"]
jit = ["dep:hashbrown", "dep:dlmalloc"]
# Compilation timing and unsupported-opcode counts, excluded from timing builds.
jit-profile = ["jit"]
# Thumb-2 backend for Armv7-M/Armv8-M Mainline cores (Cortex-M33 class). On
# 32-bit ARM targets it replaces the ARMv6K backend.
jit-t32 = ["jit"]
# Standalone, non-production FPGA instruction-set experiment.
r86chip = ["jit"]
# Compile the same x86 interpreter with chip arithmetic/translation primitives.
# This selects code at build time; there is no second x86 execution loop.
r86chip-native = ["r86chip", "machine"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
fatfs = { version = "=0.3.6", path = "vendor/fatfs", default-features = false, features = ["std", "alloc", "chrono"], optional = true }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"], optional = true }
font8x8 = { version = "0.3.1", default-features = false, optional = true }
toml = { version = "1.1.2", default-features = false, features = ["std", "parse", "serde"], optional = true }
sdl2 = { version = "0.37", optional = true }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Windows hosts: guest networking's sockets, and the Windows app's Win32 and
# GDI calls (win32-frontend).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
hashbrown = { version = "0.17.1", default-features = false, optional = true }
dlmalloc = { version = "0.2.14", default-features = false, optional = true }

[target.'cfg(target_os = "horizon")'.dependencies]
hashbrown = { version = "0.17.1", default-features = false, optional = true }

[[bin]]
name = "r86-run"
path = "src/frontend/cli.rs"
required-features = ["host"]

[[bin]]
name = "r86-handheld"
path = "src/frontend/handheld/main.rs"
required-features = ["handheld-frontend"]

[[bin]]
name = "r86-win"
path = "src/frontend/win32/main.rs"
required-features = ["win32-frontend"]

[[bin]]
name = "r86-web"
path = "src/frontend/web.rs"
required-features = ["web-frontend"]
test = false
bench = false

[[bin]]
name = "r86chip-sim"
path = "r86chip/sim/main.rs"
required-features = ["r86chip"]

[[bin]]
name = "r86chip-machine"
path = "r86chip/firmware/machine.rs"
required-features = ["machine"]
test = false
bench = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[[example]]
name = "reactos_boot_benchmark"
path = "benchmarks/reactos_livecd_boot_to_langsel/boot.rs"
required-features = ["host"]

[[example]]
name = "softmmu_boot_benchmark"
path = "benchmarks/tinycore_boot/softmmu_boot.rs"
required-features = ["host"]

[[example]]
name = "apple_jit_regions"
path = "tests/apple/jit_regions.rs"
required-features = ["host"]
